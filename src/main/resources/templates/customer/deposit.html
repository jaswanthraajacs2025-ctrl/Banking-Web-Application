<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds - Apex Horizon Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/banking-theme.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('deposit')}"></div>

        <main class="main-content">
            <div class="container-fluid p-0">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Deposit Funds</h2>
                        <p class="text-muted small mb-0">Credit funds instantly to your Apex Horizon account balance.</p>
                    </div>
                </div>

                <div class="row g-4 justify-content-center">
                    <div class="col-lg-8 col-xl-6">
                        <div class="banking-card p-4 p-sm-5 shadow-sm">
                            
                            <!-- Account Snapshot Header -->
                            <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded-3 mb-4 border">
                                <div>
                                    <small class="text-muted d-block">Depositing into Account</small>
                                    <strong class="font-monospace text-dark" th:text="${account.accountNumber}">ACC1000889901</strong>
                                </div>
                                <div class="text-end">
                                    <small class="text-muted d-block">Current Balance</small>
                                    <strong class="text-success fs-5">$<span th:text="${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">25,450.00</span></strong>
                                </div>
                            </div>

                            <form th:action="@{/customer/deposit}" th:object="${depositRequest}" method="post">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Deposit Amount ($ USD)</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light fw-bold text-success">$</span>
                                        <input type="number" step="0.01" min="5.00" max="100000.00" th:field="*{amount}" 
                                               class="form-control form-control-custom fw-bold fs-4" placeholder="500.00" required autofocus>
                                    </div>
                                    <small class="text-muted mt-1 d-block">Minimum: $5.00 | Maximum per deposit: $100,000.00</small>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Deposit Channel / Payment Method</label>
                                    <select th:field="*{paymentMethod}" class="form-select form-select-custom">
                                        <option value="ONLINE_TRANSFER">Instant Online Banking Transfer</option>
                                        <option value="WIRE_TRANSFER">Domestic Wire Inward</option>
                                        <option value="UPI_GATEWAY">UPI / Instant Gateway</option>
                                        <option value="ATM_CASH_DEPOSIT">Automated Cash Deposit Machine (CDM)</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Transaction Memo / Description (Optional)</label>
                                    <input type="text" th:field="*{description}" class="form-control form-control-custom" 
                                           placeholder="e.g. Monthly Savings Contribution">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                </div>

                                <button type="submit" class="btn btn-primary-bank w-100 py-3 rounded-3 fw-bold fs-6">
                                    <i class="bi bi-box-arrow-down me-2"></i> Confirm & Credit Funds
                                </button>
                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
