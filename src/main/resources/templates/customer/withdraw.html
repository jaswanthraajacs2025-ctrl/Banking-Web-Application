<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Withdrawal - Apex Horizon Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/banking-theme.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('withdraw')}"></div>

        <main class="main-content">
            <div class="container-fluid p-0">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Cash Withdrawal</h2>
                        <p class="text-muted small mb-0">Withdraw funds securely from your active bank account.</p>
                    </div>
                </div>

                <div class="row g-4 justify-content-center">
                    <div class="col-lg-8 col-xl-6">
                        <div class="banking-card p-4 p-sm-5 shadow-sm">
                            
                            <!-- Balance Indicator -->
                            <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded-3 mb-4 border">
                                <div>
                                    <small class="text-muted d-block">Debiting from Account</small>
                                    <strong class="font-monospace text-dark" th:text="${account.accountNumber}">ACC1000889901</strong>
                                </div>
                                <div class="text-end">
                                    <small class="text-muted d-block">Available to Withdraw</small>
                                    <strong class="text-primary fs-5">$<span th:text="${#numbers.formatDecimal(account.availableBalance, 1, 'COMMA', 2, 'POINT')}">25,450.00</span></strong>
                                </div>
                            </div>

                            <form th:action="@{/customer/withdraw}" th:object="${withdrawRequest}" method="post">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Withdrawal Amount ($ USD)</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light fw-bold text-danger">$</span>
                                        <input type="number" step="0.01" min="5.00" max="25000.00" th:field="*{amount}" 
                                               class="form-control form-control-custom fw-bold fs-4" placeholder="100.00" required autofocus>
                                    </div>
                                    <small class="text-muted mt-1 d-block">Minimum: $5.00 | Maximum per withdrawal: $25,000.00</small>
                                    <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Disbursement Method</label>
                                    <select th:field="*{method}" class="form-select form-select-custom">
                                        <option value="ATM_ELECTRONIC">ATM Cash Voucher / Electronic</option>
                                        <option value="BRANCH_COUNTER">Branch Counter Cash Pickup</option>
                                        <option value="EXPRESS_TRANSFER">Direct Electronic Payout</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Remarks / Purpose (Optional)</label>
                                    <input type="text" th:field="*{description}" class="form-control form-control-custom" 
                                           placeholder="e.g. Personal Cash Reserve">
                                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                </div>

                                <button type="submit" class="btn btn-danger w-100 py-3 rounded-3 fw-bold fs-6 shadow-sm">
                                    <i class="bi bi-box-arrow-up me-2"></i> Authorize & Withdraw Funds
                                </button>
                            </form>

                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
