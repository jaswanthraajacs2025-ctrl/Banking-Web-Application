<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Apex Horizon Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/banking-theme.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('notifications')}"></div>

        <main class="main-content">
            <div class="container-fluid p-0">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Notification Center</h2>
                        <p class="text-muted small mb-0">Real-time alerts for transactions, logins, card locks, and loan status updates.</p>
                    </div>
                    <form th:action="@{/customer/notifications/read-all}" method="post">
                        <button type="submit" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                            <i class="bi bi-check2-all me-1"></i> Mark All as Read
                        </button>
                    </form>
                </div>

                <div class="banking-card p-0 overflow-hidden shadow-sm">
                    <div class="list-group list-group-flush">
                        <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                            <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
                            <h6>No notifications recorded</h6>
                            <p class="small">You're all caught up!</p>
                        </div>

                        <div th:each="n : ${notifications}" 
                             class="list-group-item p-3 d-flex justify-content-between align-items-start"
                             th:classappend="${!n.read} ? 'bg-light bg-opacity-75 border-start border-primary border-3' : ''">
                            <div class="d-flex gap-3">
                                <div class="rounded-circle p-2 d-flex align-items-center justify-content-center"
                                     style="width: 40px; height: 40px;"
                                     th:classappend="${n.type == 'SUCCESS' ? 'bg-success bg-opacity-10 text-success' : (n.type == 'DANGER' ? 'bg-danger bg-opacity-10 text-danger' : (n.type == 'WARNING' ? 'bg-warning bg-opacity-10 text-warning' : 'bg-primary bg-opacity-10 text-primary'))}">
                                    <i class="bi" th:classappend="${n.type == 'SUCCESS' ? 'bi-check-circle-fill' : (n.type == 'DANGER' ? 'bi-exclamation-triangle-fill' : (n.type == 'WARNING' ? 'bi-shield-exclamation' : 'bi-info-circle-fill'))}"></i>
                                </div>
                                <div>
                                    <div class="d-flex align-items-center gap-2">
                                        <h6 class="fw-bold mb-0 text-dark" th:text="${n.title}">Notification Title</h6>
                                        <span th:if="${!n.read}" class="badge bg-primary rounded-pill" style="font-size: 0.65rem;">New</span>
                                    </div>
                                    <p class="small text-muted mb-1 mt-1" th:text="${n.message}">Message body</p>
                                    <small class="text-muted" style="font-size: 0.72rem;" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">26 Aug 2026, 12:30</small>
                                </div>
                            </div>

                            <div class="d-flex gap-2 align-items-center">
                                <form th:if="${!n.read}" th:action="@{/customer/notifications/{id}/read(id=${n.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-link text-decoration-none p-0 text-muted" title="Mark as read">
                                        <i class="bi bi-check2"></i>
                                    </button>
                                </form>
                                <form th:action="@{/customer/notifications/{id}/delete(id=${n.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-link text-decoration-none p-0 text-danger" title="Delete">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
