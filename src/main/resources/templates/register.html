<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open an Account - Apex Horizon Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/banking-theme.css}">
</head>
<body class="bg-light">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                
                <div class="banking-card p-4 p-sm-5 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Open Your Bank Account</h3>
                        <p class="text-muted small">Join Apex Horizon Bank in less than 2 minutes with instant digital provisioning.</p>
                    </div>

                    <!-- Flash Alerts -->
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="row g-3">
                            <!-- Full Name -->
                            <div class="col-md-12">
                                <label class="form-label fw-semibold small">Full Legal Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{fullName}" class="form-control form-control-custom border-start-0" 
                                           placeholder="e.g. Johnathan Doe" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" th:field="*{email}" class="form-control form-control-custom border-start-0" 
                                           placeholder="john.doe@example.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Mobile Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-phone"></i></span>
                                    <input type="tel" th:field="*{mobileNumber}" class="form-control form-control-custom border-start-0" 
                                           placeholder="+1 (555) 000-1234" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
                            </div>

                            <!-- DOB -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Date of Birth</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar3"></i></span>
                                    <input type="date" th:field="*{dateOfBirth}" class="form-control form-control-custom border-start-0" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                            </div>

                            <!-- Account Type -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Account Type</label>
                                <select th:field="*{accountType}" class="form-select form-select-custom">
                                    <option value="SAVINGS">Savings Account (4.5% APR)</option>
                                    <option value="CURRENT">Current / Checking Account</option>
                                </select>
                            </div>

                            <!-- Address -->
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Residential Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" th:field="*{address}" class="form-control form-control-custom border-start-0" 
                                           placeholder="123 Financial Way, Suite 100, City, State, ZIP" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <!-- Password -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control form-control-custom border-start-0" 
                                           placeholder="Min. 6 characters" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control form-control-custom border-start-0" 
                                           placeholder="Repeat password" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="col-12 pt-2">
                                <button type="submit" class="btn btn-accent w-100 py-3 rounded-3 fw-bold">
                                    <i class="bi bi-check2-circle me-2"></i> Complete Account Registration
                                </button>
                            </div>
                        </div>
                    </form>

                    <div class="text-center pt-4 border-top mt-4">
                        <span class="text-muted small">Already have an account? </span>
                        <a th:href="@{/login}" class="fw-bold text-decoration-none text-primary small">Sign In Here</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
