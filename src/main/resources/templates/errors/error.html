<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Apex Horizon Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/banking-theme.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="container text-center py-5">
        <div class="banking-card p-5 max-w-600 mx-auto shadow-lg">
            <div class="rounded-circle bg-warning bg-opacity-10 text-warning d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px;">
                <i class="bi bi-exclamation-triangle-fill fs-1"></i>
            </div>
            <h2 class="fw-bold mb-2">Request Notice</h2>
            <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested operation could not be completed.'}">
                The requested operation could not be completed.
            </p>
            <a th:href="@{/}" class="btn btn-primary-bank px-4 rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Return Home
            </a>
        </div>
    </div>
</body>
</html>
