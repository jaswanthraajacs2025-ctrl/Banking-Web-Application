<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied - Apex Horizon Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/banking-theme.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="container text-center py-5">
        <div class="banking-card p-5 max-w-600 mx-auto shadow-lg">
            <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px;">
                <i class="bi bi-shield-x fs-1"></i>
            </div>
            <h1 class="display-5 fw-bold text-danger mb-2">403</h1>
            <h4 class="fw-bold mb-2">Access Restricted</h4>
            <p class="text-muted small mb-4">
                You do not have the required administrative clearance or authority to access this protected banking module.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-primary-bank px-4 rounded-pill">
                    <i class="bi bi-house me-1"></i> Home Page
                </a>
                <a th:href="@{/login}" class="btn btn-outline-secondary px-4 rounded-pill">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </a>
            </div>
        </div>
    </div>
</body>
</html>
