# ===================================================================
# Apex Horizon Online Banking - Application Configuration
# ===================================================================

spring.application.name=Apex Horizon Online Banking
server.port=8080

# -------------------------------------------------------------------
# Datasource Configuration (MySQL / Dev Fallback)
# -------------------------------------------------------------------
# Primary: MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_banking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# File Upload & Request Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Security & Session Configuration
# -------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.error.whitelabel.enabled=false

# -------------------------------------------------------------------
# Banking Platform Custom Properties
# -------------------------------------------------------------------
banking.app.name=Apex Horizon Bank
banking.app.currency=USD
banking.app.currency-symbol=$
banking.app.support-email=support@apexhorizonbank.com
banking.app.support-phone=+1 (800) 555-APEX
